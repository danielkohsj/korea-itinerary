function renderNav(){const tmp=navLabels.map(([id,g])=>`<button type="button" data-view="${id}" class="${view===id?'active':''}" aria-current="${view===id?'page':'false'}">${t(id)}</button>`).join('');$('desktopNav').innerHTML=tmp;$('mobileNav').innerHTML=navLabels.map(([id,g])=>`<button type="button" data-view="${id}" class="${view===id?'active':''}" aria-current="${view===id?'page':'false'}"><span class="mi">${g}</span><span>${t(id)}</span></button>`).join('');$('langEN').classList.toggle('active',language==='en');$('langCN').classList.toggle('active',language==='cn');$('langJA').classList.toggle('active',language==='ja');document.documentElement.lang=language==='cn'?'zh-CN':language;}
function metaPill(s){return `<span class="pill">${s}</span>`}
function heroArt(){return `<svg viewBox="0 0 520 480" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="sky" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#d9ebe1"/><stop offset="1" stop-color="#c1e0d2"/></linearGradient><linearGradient id="sea" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#8ababc"/><stop offset="1" stop-color="#4d969b"/></linearGradient></defs><rect width="520" height="480" fill="url(#sky)"/><circle cx="361" cy="122" r="70" fill="#f7e8bf" opacity=".95"/><circle cx="361" cy="122" r="91" stroke="#fdf6e6" stroke-width="2" fill="none" opacity=".6"/><path d="M0 308L72 215 113 248 184 158 262 257 322 195 389 256 457 191 520 250V480H0Z" fill="#a6c9b5"/><path d="M0 342L90 272 149 305 229 232 309 293 392 246 520 315V480H0Z" fill="#76aea0"/><path d="M0 362Q120 345 240 368T520 360V480H0Z" fill="url(#sea)"/><path d="M0 396Q100 378 208 406T520 398M0 438Q127 411 254 444T520 435" fill="none" stroke="#d6ece2" stroke-width="3" opacity=".65"/><path d="M373 400h18v-112h-18z" fill="#274f53"/><path d="M362 288h40v11h-40z" fill="#f7eee2"/><path d="M368 280h29l-14-22z" fill="#dd8669"/><path d="M380 258v-30" stroke="#274f53" stroke-width="3"/><path d="M345 400h78" stroke="#2e6669" stroke-width="5"/><path d="M119 407l19-119 19 119zM124 369l-15 26h56l-17-26z" fill="#224e50"/><path d="M125 322l-24 35h77l-24-35z" fill="#275c5a"/><path d="M126 277l-27 54h82l-28-54z" fill="#376e65"/><rect x="135" y="404" width="8" height="23" fill="#315c56"/><path d="M41 424L59 318 78 424zM48 376l-19 27h58l-18-27z" fill="#47776b"/><path d="M44 347l-15 32h54l-18-32z" fill="#397165"/><g fill="#fffdf3" opacity=".92"><circle cx="62" cy="94" r="3"/><circle cx="240" cy="74" r="3"/><circle cx="447" cy="56" r="3"/><circle cx="411" cy="207" r="2.5"/><circle cx="195" cy="131" r="2.5"/><circle cx="88" cy="189" r="3"/></g><g stroke="#fffdf3" stroke-width="2" opacity=".85"><path d="M62 83v22M51 94h22M240 64v20M230 74h20M447 46v20M437 56h20"/></g></svg>`}
function regionCard(city,num,emoji,sub){return `<button data-jumpcity="${city}" class="region ${city.toLowerCase()}" type="button"><div class="r-top"><span class="r-ico">${emoji}</span><span class="r-count">${num} ${t('daysCount')}</span></div><div><h3>${cityName(city)}</h3><div class="r-cn">${sub}</div></div></button>`}
function miniDay(x,i){return `<button type="button" class="miniDay ${x.date===tripNow?'current':''}" data-date="${x.date}"><span class="date">${dateLabel(x)} ${x.date===tripNow?'· '+t('todayHere'):''}</span><span class="name">${esc(L(x.title,x.zh))}</span><span class="place">${esc(cityName(x.city))} · ${x.items.length} ${t('stops')}</span></button>`}
function home(){return `<section class="section"><div class="hero"><div class="heroText"><div class="eyebrow">${t('eyebrow')}</div><h1>${t('heroTitle')}</h1><p class="lead">${t('heroDesc')}</p><div class="mini">${metaPill(t('dates'))}${metaPill(t('people'))}</div><div style="margin-top:26px"><button type="button" class="primary" data-view="days">${t('explore')} <span>↗</span></button></div></div></div><div class="introline"><div><div class="eyebrow">KOREA 2026 / 27</div><h2 style="margin-top:10px">${t('tripRoute')}</h2></div><p>${t('journeySub')}</p></div><div class="regiongrid">${regionCard('Jeju',4,'🌊',L('Sea & nature','自然海景'))}${regionCard('Busan',3,'🌉',L('Coastal city','海滨城市'))}${regionCard('Seoul',6,'🏯',L('Old meets new','古今交融'))}</div><div class="introline" style="margin-top:44px"><div><h2>${t('makePlans')}</h2><p style="margin-top:10px">${t('makeSub')}</p></div>${tripNow>=data.days[0].date&&tripNow<=data.days.at(-1).date?`<button class="secondary" data-today="yes">${t('today')} ↗</button>`:''}</div><div class="daysGrid">${data.days.map(miniDay).join('')}</div>${timingsOverview()}<div class="subintro">${t('copyright')}</div></section>`}

function feasibilityPanel(x){const f=x.feasibility;if(!f)return '';const renderPairs=pairs=>pairs.map(p=>`<p>${esc(L(p[0],p[1]))}</p>`).join('');const spot=id=>x.items.find(z=>z.id===id);return `<section class="feasibility" aria-label="${L('Detailed daily feasibility analysis','详细每日可行性分析')}"><div class="planKicker">${L('DETAILED FEASIBILITY · ESTIMATES','详细可行性分析 · 估算')}</div><h3>${esc(L(f.rating,f.ratingcn))}</h3><p class="planIntro">${esc(L(f.summary,f.summarycn))}</p><div class="planFacts"><div class="planFact"><small>${L('Recommended departure','建议出发')}</small><strong>${esc(L(f.depart,f.depart))}</strong></div><div class="planFact"><small>${L('Accommodation arrival estimate','估计回到住宿')}</small><strong>${esc(L(f.returnTime,f.returnTime))}</strong></div><div class="planFact"><small>${L('Delay / optional scenario','延误／加选项情况')}</small><strong>${esc(L(f.late,f.late))}</strong></div></div><p class="planMethod">${L('All times are local, in 24-hour format. Korea UTC+9; China/Malaysia UTC+8. This is a planning model, not live routing: driving, parking, transit waits, queues and family walking pace are included in the rows. Meal/visit allowances are estimates; they are not reservations. Ranges can compound. Severe weather, closures or queues beyond the stated allowance can prevent completion. One meal/café alternative is chosen within its shared slot. The return range covers ordinary variation; the final timeline row is the base case.','全部为当地24小时制。韩国UTC+9，中马UTC+8。这是行程模型，并非实时导航；各行包含车程、停车、候车、排队及家庭步行速度。用餐及参观时长均为估算，不代表预订。延误可叠加，恶劣天气、关闭或超出预留的队伍可导致无法完成。餐厅／咖啡备选共用一个时段。回住宿范围反映一般波动，最后一行是基准情况。')}</p><details class="planDetails" open><summary>${L('Realistic timeline · main stops, meals & transfers','实际时间线 · 主要景点、餐饮及移动')}</summary><ol class="planRows">${f.rows.map(r=>`<li class="planRow ${esc(r.kind)}"><time>${esc(r.start)}–${esc(r.end)}</time><div><h4>${esc(L(r.en,r.cn))}</h4><p>${esc(L(r.note,r.cnote))}</p>${r.refs.length?`<div class="planLinks">${r.refs.map(id=>{const s=spot(id);return s?`<button type="button" data-scrollstop="${id}">${esc(L(s.name,s.zh))} ↓</button>`:''}).join('')}</div>`:''}</div></li>`).join('')}</ol></details><div class="planCautions"><h4>${L('Risks & decision points','风险及决策点')}</h4>${renderPairs(f.risks)}</div><div class="planOptional"><h4>${L('Optional stops & what they cost in time','可选项目及所需额外时间')}</h4>${renderPairs(f.optional)}</div><div class="planSources"><h4>${L('Booking status & checks','预订状态及核实')}</h4>${renderPairs(f.checks)}${f.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(L(s.label,s.label))} ↗</a>`).join('')}<p style="font-size:12px">${L('Source review: 2 Nov 2026. Official facts describe current published rules; they do not guarantee your travel date. Restaurant listings without direct confirmation are labelled. KTX is issued per your confirmation; Christmas market is booked per PDF; other timed items remain plans unless stated.','资料查询：2026年11月2日。官方资料是当前公布规则，不保证旅行当天。未直接确认的餐厅信息均有标注。高铁由你确认已出票；圣诞市集由PDF注明已订；其他预约项目未说明已订则仍是计划。')}</p></div></section>`}
function timingsOverview(){return `<section class="planOverview"><div class="planKicker">${L('LEAVE & RETURN · LOCAL TIME','出门及返回 · 当地时间')}</div><h3>${L('Every day at a glance','每天时间一眼看懂')}</h3><p>${L('Tap a day for its full feasibility analysis. Estimates include meal queues and transport buffers; optional extras can make the return later.','点击日期看详细可行性。估算已含餐饮排队及交通缓冲；加入可选项目会更晚返回。')}</p><div class="planOverviewList">${data.days.map(d=>`<button type="button" data-date="${d.date}"><strong>${esc(dateLabel(d))} · ${esc(L(d.title,d.zh))}</strong><span>${L('Leave','出发')} ${esc(L(d.feasibility.depart,d.feasibility.depart))}<br>${L('Return','回住宿')} ${esc(L(d.feasibility.returnTime,d.feasibility.returnTime))}</span></button>`).join('')}</div></section>`}

function dayPanel(x,idx){const items=x.items;let n=0;return `<div class="dayHero"><div><div class="city">${cityName(x.city)} · ${dateLabel(x)} · ${language==='cn'?`第 ${idx+1} 天`:language==='ja'?`${idx+1}日目 / 14日間`:`DAY ${idx+1} OF 14`}</div><h2>${esc(L(x.title,x.zh))}</h2><p class="zh">${esc(language==='ja'?x.title:L(x.zh,x.title))}</p><p class="description">${esc(L(x.desc,x.cn))}</p></div><div class="miniMeta">${x.date===tripNow?t('todayHere'):'WINTER 2026/27'}</div></div><div class="dayStats"><span>📍 ${items.length} ${t('stops')}</span><span>🛏️ ${esc(L(x.stay,x.stay))}</span></div>${feasibilityPanel(x)}<h3 style="margin:28px 0 18px">${L("Destinations & navigation","目的地及导航")}</h3><div class="timeline">${items.map((item,i)=>stopCard(item,i,x.city)).join('')}</div>${!x.feasibility&&x.tip?`<div class="tip"><div style="font-size:23px">💡</div><div><strong>${t('tip')}</strong><p>${esc(L(x.tip,x.tipcn))}</p></div></div>`:''}<div style="display:flex;justify-content:flex-end;margin-top:16px"><button type="button" class="secondary" data-share="${x.date}">🔗 ${t('shareDay')}</button></div>`}
function stopCard(x,i,cc){let link=makeMap(x,cc);let altTitle=language==='cn'||language==='ja'?x.name:x.zh;return `<article class="stop" id="${esc(x.id)}" tabindex="-1"><div class="stopN">${i+1}</div><div class="stopMain ${x.optional?'optional':''}"><div class="stopHeadline"><div class="stopIcon">${icon(x.kind)}</div><div class="stopText"><h3>${esc(L(x.name,x.zh))}</h3><div class="zhName">${esc(altTitle)}</div><div class="badges"><span class="tag">${t(x.kind==='stay'?'staytype':x.kind)}</span>${x.optional?`<span class="tag opt">${t('optional')}</span>`:''}${x.group?`<span class="tag choice">${t('pick')}</span>`:''}</div>${x.legacy?`<p class="legacyNote">${L("Previous website only · backup, not a main stop in the latest PDF","仅旧网站列出 · 备用，不属于新版PDF主线")}</p>`:""}${x.note?`<p class="stopDesc">${esc(L(x.note,x.cnote))}</p>${language==='ja'&&x.note?`<details class="originalNote"><summary>元のメモ（英語）</summary><p>${esc(x.note)}</p></details>`:''}`:''}</div></div>${link?`<div class="stopBottom"><a class="maplink" href="${esc(link)}" target="_blank" rel="noopener noreferrer" aria-label="${t('map')}: ${esc(x.name)}">📍 ${t('map')} ↗</a>${(x.extraLinks||[]).map(url=>`<a class="maplink" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${L("Additional map","其他地图")} ↗</a>`).join("")}</div>`:''}</div></article>`}
function days(){const idx=Math.max(0,data.days.findIndex(x=>x.date===selectedDate));return `<section class="section"><div class="sectionHeader"><div class="eyebrow">19 DEC → 1 JAN</div><h2>${t('dailyTitle')}</h2><p>${t('dailySub')}</p><button type="button" class="secondary" data-printall="yes" style="margin-top:14px">${L("Print all daily analyses","打印全部每日分析")}</button></div><div class="dateStrip" aria-label="Choose a date">${data.days.map((x,i)=>`<button type="button" data-date="${x.date}" class="dateButton ${selectedDate===x.date?'active':''}" aria-pressed="${selectedDate===x.date}"><span class="a">${dateLabel(x)}</span><span class="b">${cityName(x.city)}</span></button>`).join('')}</div>${dayPanel(data.days[idx],idx)}</section>`}
function typeOptions(){return Object.keys(EMOJI).map(k=>`<option value="${k}" ${category===k?'selected':''}>${t(k==='stay'?'staytype':k)}</option>`).join('')}
function places(){let items=[];data.days.forEach(day=>day.items.forEach((spot,i)=>{if((city==='all'||city===day.city)&&(category==='all'||category===spot.kind)&&`${spot.name} ${spot.zh} ${spot.note} ${spot.cnote} ${day.title} ${day.zh} ${day.city}`.toLowerCase().includes(query.toLowerCase().trim()))items.push({day,spot,i})}));return `<section class="section"><div class="sectionHeader"><div class="eyebrow">${data.days.reduce((n,d)=>n+d.items.length,0)} DESTINATIONS & OPTIONS</div><h2>${t('searchTitle')}</h2><p>${t('searchSub')}</p></div><div class="placeToolbar"><input id="placeSearch" class="search" type="search" autocomplete="off" placeholder="${t('searchPlaceholder')}" value="${esc(query)}" aria-label="Search destinations"><select class="filter" id="cityFilter" aria-label="Filter by city"><option value="all">${t('allCities')}</option>${['Shenzhen','Jeju','Busan','Seoul'].map(c=>`<option value="${c}" ${city===c?'selected':''}>${cityName(c)}</option>`).join('')}</select><select class="filter" id="categoryFilter" aria-label="Filter by category"><option value="all">${t('allTypes')}</option>${typeOptions()}</select></div><p style="font-size:12px;color:#83928c;margin-bottom:13px"><strong>${items.length}</strong> ${t('results')}</p>${items.length?`<div class="placesGrid">${items.map(({day,spot,i})=>`<article class="placeCard"><div class="spoticon">${icon(spot.kind)}</div><div class="body"><h3>${esc(L(spot.name,spot.zh))}</h3><p>${esc(language==='ja'?spot.name:L(spot.zh,spot.name))}</p><p>${esc(L(spot.note,spot.cnote))}</p><div class="loc">${esc(dateLabel(day))} · ${esc(cityName(day.city))}${spot.optional?' · '+t('optional'):''}</div><div class="actions"><button type="button" data-date="${day.date}">${t('viewDay')} ↗</button>${makeMap(spot,day.city)?`<a href="${esc(makeMap(spot,day.city))}" target="_blank" rel="noopener noreferrer">${t('map')} ↗</a>`:''}</div></div></article>`).join('')}</div>`:`<div class="empty">🔎 ${t('none')}</div>`}</section>`}
function info(){return `<section class="section"><div class="sectionHeader"><div class="eyebrow">TRAVEL ESSENTIALS</div><h2>${t('travelTitle')}</h2><p>${t('travelSub')}</p></div><div class="infoGrid"><div class="pagebox"><h3>✈️ ${t('journeys')}</h3><div style="margin-top:12px">${data.flights.map(f=>`<div class="tableRow"><div class="rowDate">${esc(f.date)}</div><div><div class="rowTitle">${f.train?'🚆':'✈️'} ${esc(f.number)}</div><div class="rowSub">${esc(f.route)}</div></div><div class="rowTime">${esc(f.time)}${f.status?`<br><small>${esc(language==='ja'?'発券済み・ユーザー確認':f.status)}</small>`:""}</div></div>`).join('')}</div></div><div class="pagebox"><h3>🛏️ ${t('hotels')}</h3><div style="margin-top:8px">${data.stays.map(st=>`<div class="stayCard"><div class="icon">🏡</div><div><h3>${esc(L(st.name,st.zh))}</h3><div class="stmeta">${esc(L(st.dates,st.dates))} · ${esc(cityName(st.city))}</div><div class="address">${esc(st.address)}</div><div class="sn">${esc(L(st.note,st.cn))}</div>${st.link?`<a href="${esc(st.link)}" target="_blank" rel="noopener noreferrer">📍 ${t('map')} ↗</a>`:''}</div></div>`).join('')}</div></div></div><div class="pagebox"><h3>☑ ${t('checklist')}</h3><p class="subintro" style="margin:7px 0 12px">${L("KTX024 tickets are issued (confirmed by you). Christmas market is booked per latest PDF; other booking and entry notes must be checked against actual vouchers.","KTX024已出票（你已确认）。圣诞市集由新版PDF注明已订；其余预订及入境备忘须以实际凭证及规定再核对。")}</p>${data.checklist.map(c=>`<div class="check ${c.done?'done':''}"><div class="bubble">${c.done?'✓':''}</div><div><div class="summary">${esc(L(c.name,c.cn))}</div><div class="when">${esc(L(c.date,c.date))}</div></div></div>`).join('')}</div><div class="pagebox"><h3>${L("Additional PDF map","PDF其他地图")}</h3>${data.additionalPDFMaps.map(s=>`<p class="subintro"><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(L(s.label,s.label))} ↗</a></p>`).join("")}</div><div class="callout">${t('offline')}<br>${L("No photos, external fonts or network requests are needed to read this file. Maps and source links need internet. A copied local file link works only on the same device; share the HTML/ZIP itself, or upload to your own static host for a family web link.","阅读本文件无需照片、外部字体或联网请求。地图及资料链接需上网。本地文件链接只在同一设备有效；请分享HTML／ZIP文件，或上传到自己的静态网站托管后分享网址。")}</div></section>`}
function render(){renderNav();document.querySelector('footer').innerHTML=language==='ja'?'<div>韓国旅行 · 2026年12月19日〜2027年1月1日</div><div>元の時間分析を保持 · KTX発券済み</div>':language==='cn'?'<div>韩国旅行 · 2026年12月19日–2027年1月1日</div><div>保留原有时间分析 · KTX已出票</div>':'<div>Korea · 19 Dec 2026 – 1 Jan 2027</div><div>Original timing analysis retained · KTX issued</div>';document.querySelector('[data-i18n=top]').textContent=t('top');$('mainContent').innerHTML=({home,days,places,info}[view])();if(view==='days'){const strip=document.querySelector('.dateStrip'),active=strip?.querySelector('.active');if(strip&&active)strip.scrollLeft=active.offsetLeft-strip.offsetLeft-(strip.clientWidth-active.clientWidth)/2;}$('backTop').classList.toggle('hidden',view==='home');document.title=(view==='days'?`${L('Day','第')}: ${L(data.days.find(x=>x.date===selectedDate)?.title||'',data.days.find(x=>x.date===selectedDate)?.zh||'')} · `:'')+'Korea · Winter 2026–27';}
function go(newView,day){view=newView;if(day)selectedDate=day;try{history.replaceState(null,'',newView==='days'?`#day=${selectedDate}`:`#${newView}`)}catch(_){}render();scrollTo({top:0,behavior:'smooth'});}
document.addEventListener('click',e=>{const stop=e.target.closest('[data-scrollstop]');if(stop){const target=document.getElementById(stop.dataset.scrollstop);target?.scrollIntoView({behavior:'smooth',block:'start'});target?.focus({preventScroll:true});return}const pa=e.target.closest('[data-printall]');if(pa){const prior=$('mainContent').innerHTML;$('mainContent').innerHTML=data.days.map((d,i)=>`<section class="printDay"><h2>${esc(dateLabel(d))} · ${esc(L(d.title,d.zh))}</h2><p>${L('Tonight','今晚住宿')}: ${esc(L(d.stay,d.stay))}</p>${feasibilityPanel(d)}</section>`).join('');window.addEventListener('afterprint',()=>render(),{once:true});try{window.print()}finally{render()}return}const l=e.target.closest('#langEN,#langCN,#langJA');if(l){language=l.id==='langCN'?'cn':l.id==='langJA'?'ja':'en';try{localStorage.setItem('krLang',language)}catch(_){}render();return}const v=e.target.closest('[data-view]');if(v){go(v.dataset.view);return}const dt=e.target.closest('[data-date]');if(dt){go('days',dt.dataset.date);return}const ct=e.target.closest('[data-jumpcity]');if(ct){const item=data.days.find(x=>x.city===ct.dataset.jumpcity);go('days',item.date);return}if(e.target.closest('[data-today]')){go('days',data.days.find(x=>x.date===tripNow)?.date||data.days[0].date);return}const sh=e.target.closest('[data-share]');if(sh){if(location.protocol==='file:'){window.alert(L('This is a local HTML file. Share the HTML/ZIP itself, or host it online to get a link other devices can open.','这是本地HTML文件。请分享HTML／ZIP文件，或托管上线以取得其他设备可打开的网址。'));return}const url=location.href.split('#')[0]+`#day=${sh.dataset.share}`;if(navigator.clipboard?.writeText){navigator.clipboard.writeText(url).then(()=>{sh.textContent='✓ '+t('copied');setTimeout(()=>sh.textContent='🔗 '+t('shareDay'),1800)}).catch(()=>window.prompt('Copy link',url))}else window.prompt('Copy link',url);return}if(e.target.closest('#backTop'))scrollTo({top:0,behavior:'smooth'});});
document.addEventListener('input',e=>{if(e.target.id==='placeSearch'){if(e.isComposing)return;query=e.target.value;const start=e.target.selectionStart;const filter=$('cityFilter')?.value;const type=$('categoryFilter')?.value;const sp=document.activeElement;const holder=$('mainContent');const newHTML=places();holder.innerHTML=newHTML;const input=$('placeSearch');input.focus({preventScroll:true});input.setSelectionRange(start,start);}});
document.addEventListener('change',e=>{if(e.target.id==='cityFilter'){city=e.target.value;$('mainContent').innerHTML=places()}if(e.target.id==='categoryFilter'){category=e.target.value;$('mainContent').innerHTML=places()}});
window.addEventListener('hashchange',()=>{const nextDay=dayHash();if(nextDay&&data.days.some(x=>x.date===nextDay)){view='days';selectedDate=nextDay}else{const h=location.hash.slice(1);if(['home','days','places','info'].includes(h))view=h}render()});
$('brand').addEventListener('click',e=>{e.preventDefault();go('home')});render();
})();
</script>
</body>
</html>
